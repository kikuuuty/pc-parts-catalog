name: Catalog checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Migrate local D1
        run: npm run db:migrate
      - name: Validate and import pinned real upstream snapshot
        run: npm run upstream:fetch -- --ref eec0df175504ebd15f0f3e3a8249a18a22f00940
      - run: npm run sync
      - run: npm run stats
      - name: Verify all category projections and no-change sync
        run: npm run verify:catalog
      - run: npm run audit:completeness -- --output .cache/completeness.json
      - run: npm run audit:duplicates -- --output .cache/duplicates.json
      # One shared gate computes source integrity, real-snapshot Filter metadata,
      # all search intent metrics and plans (do not benchmark the same data twice).
      - name: Enforce source, Filter metadata and search release gates
        run: npm run release:verify -- --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-d1-verification
          include-hidden-files: true
          path: |
            .cache/inspection.json
            .cache/upstream-categories.json
            .cache/all-categories-verification.json
            .cache/sync-report.json
            .cache/completeness.json
            .cache/duplicates.json
            .cache/release-*.json
          retention-days: 7
  cross-snapshot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Isolated pinned A to B delta sync, full release gates and Worker HTTP
        run: npm run verify:release:cross-snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-snapshot-release-verification
          include-hidden-files: true
          path: |
            .cache/cross-snapshot-latest.json
            .cache/cross-snapshot-*/report.json
            .cache/cross-snapshot-*/manifest.json
            .cache/cross-snapshot-*/source-a-integrity.json
            .cache/cross-snapshot-*/source-*/inspection.json
            .cache/cross-snapshot-*/source-*/upstream-categories.json
            .cache/cross-snapshot-*/release-*.json
            .cache/cross-snapshot-*/worker.*.log
          retention-days: 7

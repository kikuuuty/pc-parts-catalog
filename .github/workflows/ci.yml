name: Catalog checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Migrate local D1
        run: npm run db:migrate
      - name: Validate and import pinned real upstream snapshot
        run: npm run upstream:fetch -- --ref eec0df175504ebd15f0f3e3a8249a18a22f00940
      - run: npm run sync
      - run: npm run verify:plans
      - run: npm run stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-d1-verification
          path: |
            .cache/inspection.json
            .cache/sync-report.json
            .cache/query-plans.json
          retention-days: 7
